<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nao Méndez | Link en Bio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --hot: #ff2d87;
            --hot-deep: #d6146a;
            --magenta: #ff5fa2;
            --blush: #ffd6e8;
            --ink: #3a0d24;
            --gold: #ffc857;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(160deg, #ff2d87 0%, #ff6fa8 45%, #ffb3d1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* --- Manchas de luz de fondo, energía TikTok --- */
        body::before,
        body::after {
            content: '';
            position: fixed;
            width: 55vmax;
            height: 55vmax;
            border-radius: 50%;
            filter: blur(60px);
            z-index: 0;
            opacity: 0.55;
        }
        body::before {
            background: #ffe37a;
            top: -20%;
            left: -20%;
        }
        body::after {
            background: #c400ff;
            bottom: -25%;
            right: -20%;
            opacity: 0.35;
        }

        /* --- Confeti cayendo, más presencia --- */
        .falling-elements {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            top: -8%;
            font-size: 16px;
            opacity: 0.8;
            animation: fall linear infinite;
            filter: drop-shadow(0 0 4px rgba(255,255,255,0.4));
        }

        @keyframes fall {
            0%   { transform: translateY(-10vh) rotate(0deg) scale(0.8); opacity: 0; }
            10%  { opacity: 0.9; }
            90%  { opacity: 0.7; }
            100% { transform: translateY(110vh) rotate(320deg) scale(1.1); opacity: 0; }
        }

        .petal.p1  { left: 6%;  animation-duration: 13s; animation-delay: 0s;  font-size: 18px; }
        .petal.p2  { left: 18%; animation-duration: 17s; animation-delay: 3s;  font-size: 13px; }
        .petal.p3  { left: 30%; animation-duration: 14s; animation-delay: 8s;  font-size: 20px; }
        .petal.p4  { left: 42%; animation-duration: 19s; animation-delay: 1s;  font-size: 15px; }
        .petal.p5  { left: 58%; animation-duration: 15s; animation-delay: 6s;  font-size: 19px; }
        .petal.p6  { left: 70%; animation-duration: 18s; animation-delay: 10s; font-size: 14px; }
        .petal.p7  { left: 82%; animation-duration: 12s; animation-delay: 4s;  font-size: 17px; }
        .petal.p8  { left: 92%; animation-duration: 16s; animation-delay: 12s; font-size: 16px; }

        /* --- Tarjeta principal, energía TikTok / moda-belleza --- */
        .container {
            background: #fff;
            max-width: 380px;
            width: 100%;
            border-radius: 32px;
            padding: 44px 30px 34px;
            text-align: center;
            box-shadow: 0 30px 60px -15px rgba(214, 20, 106, 0.45), 0 2px 8px rgba(58, 13, 36, 0.08);
            position: relative;
            z-index: 1;
            border: 3px solid var(--hot);
        }

        .eyebrow {
            display: inline-block;
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #fff;
            font-weight: 600;
            margin-bottom: 20px;
            background: linear-gradient(90deg, var(--hot) 0%, var(--magenta) 100%);
            padding: 5px 16px;
            border-radius: 20px;
        }

        .profile-container {
            position: relative;
            display: inline-block;
            margin-bottom: 18px;
        }

        .ribbon-ring {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--hot), var(--gold), var(--magenta), #c400ff, var(--hot));
            z-index: 0;
        }

        .profile-pic {
            width: 116px;
            height: 116px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 10px 24px rgba(214, 20, 106, 0.4);
            display: block;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            color: var(--ink);
            font-size: 30px;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }

        .subtitle {
            color: var(--hot-deep);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .divider {
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, var(--hot), var(--gold));
            border-radius: 4px;
            margin: 22px auto 26px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            background: linear-gradient(135deg, #fff5fa 0%, var(--blush) 100%);
            color: var(--ink);
            text-decoration: none;
            padding: 16px 22px;
            border-radius: 18px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.3px;
            border: 2px solid transparent;
            position: relative;
            transition: border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            text-align: left;
            overflow: hidden;
        }

        .link-btn img {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            transition: transform 0.25s ease;
        }

        .link-btn .tag-hole {
            display: none;
        }

        .link-btn .label {
            display: flex;
            flex-direction: column;
        }

        .link-btn .label span.name {
            font-size: 15px;
            font-weight: 600;
            color: var(--hot-deep);
        }

        .link-btn .label span.tagline {
            font-size: 10px;
            color: #a3527a;
            font-weight: 400;
            letter-spacing: 0.3px;
            margin-top: 1px;
        }

        .link-btn:hover {
            border-color: var(--hot);
            background: linear-gradient(135deg, var(--hot) 0%, var(--magenta) 100%);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 26px rgba(214, 20, 106, 0.4);
        }

        .link-btn:hover .label span.name,
        .link-btn:hover .label span.tagline { color: #fff; }

        .link-btn:hover img {
            transform: scale(1.1) rotate(-4deg);
            filter: brightness(0) invert(1);
        }

        .footer-note {
            margin-top: 28px;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            color: var(--hot-deep);
        }
    </style>
</head>
<body>

    <div class="falling-elements">
        <span class="petal p1">💖</span>
        <span class="petal p2">✨</span>
        <span class="petal p3">💋</span>
        <span class="petal p4">🎀</span>
        <span class="petal p5">💖</span>
        <span class="petal p6">✨</span>
        <span class="petal p7">🎀</span>
        <span class="petal p8">💋</span>
    </div>

    <div class="container">
        <p class="eyebrow">✨ Sigueme en todas mis cuentas ✨</p>

        <header class="profile-container">
            <div class="ribbon-ring"></div>
            <img src="profile.png" alt="Nao Méndez" class="profile-pic" onerror="this.src='https://via.placeholder.com/116x116/f7dbe0/a8395a?text=Nao'">
        </header>

        <h1>Nao Méndez</h1>
        <p class="subtitle">Moda &middot; Belleza &middot; Maquillaje</p>

        <div class="divider"></div>

        <nav class="links-container">
            <a href="https://www.instagram.com/justnaomdz?igsh=amswdmg5anhmdmth" class="link-btn" target="_blank">
                <span class="tag-hole"></span>
                <img src="instagram.png" alt="Instagram" onerror="this.src='https://via.placeholder.com/20x20/d46a82/ffffff?text=IG'">
                <span class="label">
                    <span class="name">Instagram</span>
                    <span class="tagline">Moda &amp; looks del día</span>
                </span>
            </a>

            <a href="https://www.tiktok.com/" class="link-btn" target="_blank">
                <span class="tag-hole"></span>
                <img src="tiktok.png" alt="TikTok" onerror="this.src='https://via.placeholder.com/20x20/d46a82/ffffff?text=TT'">
                <span class="label">
                    <span class="name">TikTok</span>
                    <span class="tagline">Cuenta principal</span>
                </span>
            </a>

            <a href="https://www.tiktok.com/" class="link-btn" target="_blank">
                <span class="tag-hole"></span>
                <img src="tiktok.png" alt="TikTok ASMR" onerror="this.src='https://via.placeholder.com/20x20/d46a82/ffffff?text=TT'">
                <span class="label">
                    <span class="name">TikTok &mdash; ASMR</span>
                    <span class="tagline">Mi cuenta secundaria</span>
                </span>
            </a>

            <a href="https://youtube.com/@naomendez?si=h9tR0g1IjBX0o_T7" class="link-btn" target="_blank">
                <span class="tag-hole"></span>
                <img src="youtube.png" alt="YouTube" onerror="this.src='https://via.placeholder.com/20x20/d46a82/ffffff?text=YT'">
                <span class="label">
                    <span class="name">YouTube</span>
                    <span class="tagline">Videos completos</span>
                </span>
            </a>
        </nav>

        <p class="footer-note">Con cariño, Nao</p>
    </div>

</body>
</html>
