<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nao Méndez | Link en Bio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --hot: #e6006e;
            --hot-deep: #b8005a;
            --magenta: #ff4d9e;
            --blush: #fbe3ee;
            --ink: #2a0a1a;
            --gold: #d4af6a;
            --noir: #1c1015;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at 50% 0%, #4a0524 0%, var(--noir) 55%, #14090d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* --- Halo dorado sutil de fondo --- */
        body::before {
            content: '';
            position: fixed;
            width: 60vmax;
            height: 60vmax;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 106, 0.18) 0%, transparent 65%);
            top: -15%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            width: 70vmax;
            height: 70vmax;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(230, 0, 110, 0.15) 0%, transparent 60%);
            bottom: -30%;
            right: -10%;
            z-index: 0;
        }

        /* --- Destellos cayendo, discretos y finos --- */
        .falling-elements {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            top: -8%;
            font-size: 11px;
            opacity: 0.55;
            animation: fall linear infinite;
            color: var(--gold);
        }

        @keyframes fall {
            0%   { transform: translateY(-10vh) rotate(0deg) scale(0.8); opacity: 0; }
            10%  { opacity: 0.6; }
            90%  { opacity: 0.4; }
            100% { transform: translateY(110vh) rotate(200deg) scale(1); opacity: 0; }
        }

        .petal.p1  { left: 6%;  animation-duration: 18s; animation-delay: 0s;  }
        .petal.p2  { left: 18%; animation-duration: 23s; animation-delay: 3s;  font-size: 8px; }
        .petal.p3  { left: 30%; animation-duration: 19s; animation-delay: 8s;  }
        .petal.p4  { left: 42%; animation-duration: 25s; animation-delay: 1s;  font-size: 9px; }
        .petal.p5  { left: 58%; animation-duration: 20s; animation-delay: 6s;  }
        .petal.p6  { left: 70%; animation-duration: 24s; animation-delay: 10s; font-size: 8px; }
        .petal.p7  { left: 82%; animation-duration: 17s; animation-delay: 4s;  }
        .petal.p8  { left: 92%; animation-duration: 21s; animation-delay: 12s; font-size: 9px; }

        /* --- Tarjeta principal, elegante y editorial --- */
        .container {
            background: linear-gradient(165deg, #fff9fb 0%, #fdf1f6 100%);
            max-width: 380px;
            width: 100%;
            border-radius: 6px;
            padding: 46px 34px 36px;
            text-align: center;
            box-shadow: 0 35px 70px -20px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(212, 175, 106, 0.25);
            position: relative;
            z-index: 1;
        }

        .container::before,
        .container::after {
            content: '';
            position: absolute;
            width: 26px;
            height: 26px;
            border: 1px solid var(--gold);
        }
        .container::before { top: 12px; left: 12px; border-right: none; border-bottom: none; }
        .container::after  { bottom: 12px; right: 12px; border-left: none; border-top: none; }

        .eyebrow {
            display: inline-block;
            font-size: 9.5px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
            font-weight: 500;
            margin-bottom: 22px;
        }

        .profile-container {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        .ribbon-ring {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 1px solid var(--gold);
            z-index: 0;
        }

        .profile-pic {
            width: 114px;
            height: 114px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fff;
            box-shadow: 0 12px 26px rgba(184, 0, 90, 0.35);
            display: block;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 600;
            color: var(--ink);
            font-size: 34px;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: var(--hot-deep);
            font-size: 10.5px;
            font-weight: 500;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .divider {
            width: 1px;
            height: 26px;
            background: var(--gold);
            margin: 22px auto 24px;
            position: relative;
        }
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            width: 6px;
            height: 6px;
            background: var(--hot);
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #fff;
            color: var(--ink);
            text-decoration: none;
            padding: 16px 22px;
            border-radius: 3px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.3px;
            border: 1px solid var(--blush);
            position: relative;
            transition: border-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
            text-align: left;
        }

        .link-btn img {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .link-btn .tag-hole {
            display: none;
        }

        .link-btn .label {
            display: flex;
            flex-direction: column;
        }

        .link-btn .label span.name {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .link-btn .label span.tagline {
            font-size: 10px;
            color: #b98ba1;
            font-weight: 300;
            letter-spacing: 0.4px;
            margin-top: 1px;
        }

        .link-btn:hover {
            border-color: var(--hot);
            background: linear-gradient(165deg, #ffffff 0%, var(--blush) 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(184, 0, 90, 0.22);
        }

        .link-btn:hover img { transform: scale(1.06); }

        .footer-note {
            margin-top: 30px;
            font-size: 9px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 500;
            color: var(--gold);
        }
    </style>
</head>
<body>

    <div class="falling-elements">
        <span class="petal p1">✦</span>
        <span class="petal p2">✧</span>
        <span class="petal p3">✦</span>
        <span class="petal p4">✧</span>
        <span class="petal p5">✦</span>
        <span class="petal p6">✧</span>
        <span class="petal p7">✦</span>
        <span class="petal p8">✧</span>
    </div>

    <div class="container">
        <p class="eyebrow">Sigueme en todas mis cuentas</p>

        <header class="profile-container">
            <div class="ribbon-ring"></div>
            <img src="profile.png" alt="Nao Méndez" class="profile-pic" onerror="this.src='https://via.placeholder.com/116x116/f7dbe0/a8395a?text=Nao'">
        </header>

        <h1>Nao Méndez</h1>
        <p class="subtitle">Moda &middot; Belleza &middot; Maquillaje</p>

        <div class="divider"></div>

        <nav class="links-container">
            <a href="https://www.instagram.com/justnaomdz?igsh=amswdmg5anhmdmth" class="link-btn" target="_blank">
                <span class="tag-hole"></span>
                <img src="instagram.png" alt="Instagram" onerror="this.src='https://via.placeholder.com/20x20/d46a82/ffffff?text=IG'">
                <span class="label">
                    <span class="name">Instagram</span>
                    <span class="tagline">Moda &amp; looks del día</span>
                </span>
            </a>

            <a href="https://www.tiktok.com/" class="link-btn" target="_blank">
                <span class="tag-hole"></span>
                <img src="tiktok.png" alt="TikTok" onerror="this.src='https://via.placeholder.com/20x20/d46a82/ffffff?text=TT'">
                <span class="label">
                    <span class="name">TikTok</span>
                    <span class="tagline">Cuenta principal</span>
                </span>
            </a>

            <a href="https://www.tiktok.com/" class="link-btn" target="_blank">
                <span class="tag-hole"></span>
                <img src="tiktok.png" alt="TikTok ASMR" onerror="this.src='https://via.placeholder.com/20x20/d46a82/ffffff?text=TT'">
                <span class="label">
                    <span class="name">TikTok &mdash; ASMR</span>
                    <span class="tagline">Mi cuenta secundaria</span>
                </span>
            </a>

            <a href="https://youtube.com/@naomendez?si=h9tR0g1IjBX0o_T7" class="link-btn" target="_blank">
                <span class="tag-hole"></span>
                <img src="youtube.png" alt="YouTube" onerror="this.src='https://via.placeholder.com/20x20/d46a82/ffffff?text=YT'">
                <span class="label">
                    <span class="name">YouTube</span>
                    <span class="tagline">Videos completos</span>
                </span>
            </a>
        </nav>

        <p class="footer-note">Nao Mendez</p>
    </div>

</body>
</html>
